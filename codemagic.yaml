workflows:
  wizard-chess-unsigned-ipa:
    name: Build WizardChess3D.ipa (No Signing)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      vars:
        APP_NAME: "Wizard Chess 3D"
        APP_ID: "com.deadpeoples.wizardchess"
        COPYRIGHT_TEXT: "© 2026 Dead Peoples INC."
    scripts:
      - name: 1. Instalacja zależności i budowanie wersji webowej
        script: |
          npm install
          npx vite build --base=./

      - name: 2. Konfiguracja stabilnego Capacitor 8.6.0 i iOS
        script: |
          npm install @capacitor/core@8.6.0 @capacitor/cli@8.6.0 @capacitor/ios@8.6.0
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.deadpeoples.wizardchess",
            "appName": "Wizard Chess 3D",
            "webDir": "dist"
          }
          EOF
          npx cap add ios

      - name: 3. Dodanie praw autorskich Dead Peoples INC. do Info.plist
        script: |
          /usr/libexec/PlistBuddy -c "Add :NSHumanReadableCopyright string '$COPYRIGHT_TEXT'" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :NSHumanReadableCopyright '$COPYRIGHT_TEXT'" ios/App/App/Info.plist

      - name: 4. Generowanie ikony szachów (z assets/icon-only.png)
        script: |
          if [ -f "assets/icon-only.png" ]; then
            npm install -D @capacitor/assets
            npx capacitor-assets generate --ios
          fi

      - name: 5. Synchronizacja z projektem iOS
        script: |
          npx cap sync ios

      - name: 6. Kompilacja czystego .app całkowicie bez podpisu kodu
        script: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_data \
            clean build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_REQUIRED=NO \
            CODE_SIGN_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: 7. Pakowanie do pliku WizardChess3D.ipa
        script: |
          mkdir -p out/Payload
          cp -r build_data/Build/Products/Release-iphoneos/App.app out/Payload/
          cd out
          zip -qry "WizardChess3D.ipa" Payload

    artifacts:
      - out/WizardChess3D.ipa
