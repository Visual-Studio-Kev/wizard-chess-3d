name: Build WizardChess3D.ipa

on:
  workflow_dispatch:

env:
  APP_NAME: "Wizard Chess 3D"
  APP_ID: "com.deadpeoples.wizardchess"
  COPYRIGHT_TEXT: "© 2026 Dead Peoples INC."

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Budowanie wersji webowej ze ścieżkami względnymi (Vite)
        run: |
          npm install
          npx vite build --base=./

      - name: Konfiguracja Capacitor i iOS (iPhone + iPad)
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "$APP_NAME" "$APP_ID" --web-dir "dist"
          npx cap add ios

      - name: Wpisanie praw autorskich Dead Peoples INC. do Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSHumanReadableCopyright string '$COPYRIGHT_TEXT'" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :NSHumanReadableCopyright '$COPYRIGHT_TEXT'" ios/App/App/Info.plist

      - name: Generowanie ikony szachów (z assets/icon-only.png)
        run: |
          if [ -f "assets/icon-only.png" ]; then
            npm install -D @capacitor/assets
            npx capacitor-assets generate --ios
          fi

      - name: Synchronizacja plików z projektem iOS
        run: npx cap sync ios

      - name: Kompilacja czystego .app bez podpisu kodu
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_data \
            clean build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_REQUIRED=NO \
            CODE_SIGN_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: Pakowanie do WizardChess3D.ipa i weryfikacja modeli 3D
        run: |
          mkdir -p out/Payload
          cp -r build_data/Build/Products/Release-iphoneos/App.app out/Payload/
          ls -la out/Payload/App.app/public/assets/glb/
          cd out
          zip -qry "WizardChess3D.ipa" Payload

      - name: Udostępnienie gotowego pliku do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: WizardChess3D-IPA
          path: out/WizardChess3D.ipa
