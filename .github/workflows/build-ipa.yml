name: Build WizardChess3D.ipa

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_NAME: "Wizard Chess 3D"
  APP_ID: "com.deadpeoples.wizardchess"
  COPYRIGHT_TEXT: "© 2026 Dead Peoples INC."

jobs:
  build-ios:
    name: Budowanie aplikacji iOS
    runs-on: macos-latest

    steps:
      - name: 1. Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: 2. Konfiguracja środowiska Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Instalacja zależności i budowanie aplikacji webowej
        run: |
          npm install
          npx vite build --base=./

      - name: 4. Konfiguracja Capacitor (JSON) i dodanie platformy iOS
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.deadpeoples.wizardchess",
            "appName": "Wizard Chess 3D",
            "webDir": "dist"
          }
          EOF
          npx cap add ios

      - name: 5. Wpisanie praw autorskich Dead Peoples INC. do Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSHumanReadableCopyright string '$COPYRIGHT_TEXT'" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :NSHumanReadableCopyright '$COPYRIGHT_TEXT'" ios/App/App/Info.plist

      - name: 6. Generowanie ikony szachów (z assets/icon-only.png)
        run: |
          if [ -f "assets/icon-only.png" ]; then
            npm install -D @capacitor/assets
            npx capacitor-assets generate --ios
          fi

      - name: 7. Synchronizacja projektu Capacitor z iOS
        run: npx cap sync ios

      - name: 8. Naprawa sum kontrolnych SPM (obejście błędu 8.6.1)
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf build_data/SourcePackages
          rm -f ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

          if [ -f "ios/App/CapApp-SPM/Package.swift" ]; then
            sed -i '' 's/exact: "8.6.1"/exact: "8.6.0"/g' ios/App/CapApp-SPM/Package.swift
            sed -i '' 's/from: "8.6.1"/exact: "8.6.0"/g' ios/App/CapApp-SPM/Package.swift
            sed -i '' 's/"8.6.1"/"8.6.0"/g' ios/App/CapApp-SPM/Package.swift
          fi

      - name: 9. Rozwiązanie zależności SPM
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -derivedDataPath build_data

      - name: 10. Kompilacja aplikacji w Xcode (bez podpisywania)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_data \
            clean build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_REQUIRED=NO \
            CODE_SIGN_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: 11. Pakowanie niepodpisanego pliku WizardChess3D.ipa
        run: |
          mkdir -p out/Payload
          cp -r build_data/Build/Products/Release-iphoneos/App.app out/Payload/
          cd out
          zip -qry "WizardChess3D.ipa" Payload

      - name: 12. Wysłanie gotowego pliku .ipa jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: WizardChess3D-IPA
          path: out/WizardChess3D.ipa
          retention-days: 7
