name: Build iOS App (Capacitor)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Budowanie aplikacji iOS
    runs-on: macos-latest

    steps:
      - name: 1. Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: 2. Konfiguracja środowiska Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Instalacja zależności Node.js
        run: npm ci

      - name: 4. Budowanie aplikacji webowej
        run: npm run build

      - name: 5. Synchronizacja projektu Capacitor z iOS
        run: npx cap sync ios

      - name: 6. Naprawa sum kontrolnych SPM (obejście błędu 8.6.1)
        run: |
          echo "Czyszczenie pamięci podręcznej Swift Package Manager..."
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf build_data/SourcePackages
          rm -f ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

          echo "Wymuszanie stabilnej wersji 8.6.0 w CapApp-SPM/Package.swift..."
          if [ -f "ios/App/CapApp-SPM/Package.swift" ]; then
            sed -i '' 's/exact: "8.6.1"/exact: "8.6.0"/g' ios/App/CapApp-SPM/Package.swift
            sed -i '' 's/from: "8.6.1"/exact: "8.6.0"/g' ios/App/CapApp-SPM/Package.swift
            sed -i '' 's/"8.6.1"/"8.6.0"/g' ios/App/CapApp-SPM/Package.swift
            cat ios/App/CapApp-SPM/Package.swift
          fi

      - name: 7. Rozwiązanie zależności SPM
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -derivedDataPath build_data

      - name: 8. Kompilacja aplikacji w Xcode (bez podpisywania)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_data \
            clean build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_REQUIRED=NO \
            CODE_SIGN_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: 9. Pakowanie niepodpisanego pliku .ipa
        run: |
          mkdir -p Payload
          cp -r build_data/Build/Products/Release-iphoneos/App.app Payload/
          zip -r App-unsigned.ipa Payload

      - name: 10. Wysłanie gotowego pliku .ipa jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: App-unsigned.ipa
          retention-days: 7
