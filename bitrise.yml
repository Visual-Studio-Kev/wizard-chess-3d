format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
    - APP_NAME: "Wizard Chess 3D"
    - APP_ID: "com.deadpeoples.wizardchess"
    - COPYRIGHT_TEXT: "© 2026 Dead Peoples INC."

workflows:
  primary:
    steps:
      - git-clone@8: {}

      - script@1:
          title: 1. Budowanie aplikacji webowej i konfiguracja Capacitor 8.6.0
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -ex

                # Czysta instalacja zależności
                npm install

                # Kompilacja webowa ze ścieżkami względnymi (zapobiega białemu ekranowi na iOS)
                npx vite build --base=./

                # Instalacja stabilnej wersji Capacitora
                npm install @capacitor/core@8.6.0 @capacitor/cli@8.6.0 @capacitor/ios@8.6.0

                # Utworzenie czystego pliku konfiguracyjnego JSON (brak błędu parsera TS)
                cat << 'EOF' > capacitor.config.json
                {
                  "appId": "com.deadpeoples.wizardchess",
                  "appName": "Wizard Chess 3D",
                  "webDir": "dist"
                }
                EOF

                # Dodanie platformy iOS tylko jeśli katalog jeszcze nie istnieje
                if [ ! -d "ios" ]; then
                  npx cap add ios
                fi

      - script@1:
          title: 2. Prawa autorskie Dead Peoples INC. oraz ikona aplikacji
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -ex

                # Bezpieczne ustawienie praw autorskich w Info.plist z użyciem zmiennej środowiskowej
                PLIST_PATH="ios/App/App/Info.plist"
                if /usr/libexec/PlistBuddy -c "Print :NSHumanReadableCopyright" "$PLIST_PATH" 2>/dev/null; then
                  /usr/libexec/PlistBuddy -c "Set :NSHumanReadableCopyright \"$COPYRIGHT_TEXT\"" "$PLIST_PATH"
                else
                  /usr/libexec/PlistBuddy -c "Add :NSHumanReadableCopyright string \"$COPYRIGHT_TEXT\"" "$PLIST_PATH"
                fi

                # Generowanie ikon jeśli plik źródłowy istnieje
                if [ -f "assets/icon-only.png" ]; then
                  npm install -D @capacitor/assets
                  npx capacitor-assets generate --ios
                fi

                # Pełna synchronizacja plików natywnych Capacitora
                npx cap sync ios

      - script@1:
          title: 3. Kompilacja czystego WizardChess3D.ipa (bez podpisu)
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -ex

                # Czyszczenie i kompilacja projektu Xcode z całkowitym pominięciem podpisywania
                xcodebuild -project ios/App/App.xcodeproj \
                  -scheme App \
                  -configuration Release \
                  -sdk iphoneos \
                  -derivedDataPath build_data \
                  clean build \
                  CODE_SIGN_IDENTITY="" \
                  CODE_SIGN_REQUIRED=NO \
                  CODE_SIGN_ALLOWED=NO \
                  AD_HOC_CODE_SIGNING_ALLOWED=NO

                # Pakowanie pliku IPA do Payload w celu zgodności z architekturą Sideloadly
                mkdir -p out/Payload
                cp -r build_data/Build/Products/Release-iphoneos/App.app out/Payload/
                cd out
                zip -qry "WizardChess3D.ipa" Payload

                # Archiwizacja do zip dla kroku deploy w Bitrise
                zip -qry "$BITRISE_DEPLOY_DIR/WizardChess3D-ipa.zip" "WizardChess3D.ipa"

      - deploy-to-bitrise-io@2:
          inputs:
            - pipeline_intermediate_files: ""
    meta:
      bitrise.io:
        stack: osx-xcode-latest-stable
        machine_type_id: g2.mac.large
