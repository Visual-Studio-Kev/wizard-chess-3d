format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
    - APP_NAME: "Wizard Chess 3D"
    - APP_ID: "com.deadpeoples.wizardchess"
    - COPYRIGHT_TEXT: "© 2026 Dead Peoples INC."

workflows:
  primary:
    steps:
      - git-clone@8: {}

      - script@1:
          title: 1. Budowanie aplikacji webowej i konfiguracja Capacitor 8.6.0
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -ex
                npm install
                npx vite build --base=./

                npm install @capacitor/core@8.6.0 @capacitor/cli@8.6.0 @capacitor/ios@8.6.0
                cat << 'EOF' > capacitor.config.json
                {
                  "appId": "com.deadpeoples.wizardchess",
                  "appName": "Wizard Chess 3D",
                  "webDir": "dist"
                }
                EOF
                npx cap add ios

      - script@1:
          title: 2. Prawa autorskie Dead Peoples INC. oraz ikona aplikacji
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -ex
                /usr/libexec/PlistBuddy -c "Add :NSHumanReadableCopyright string '$COPYRIGHT_TEXT'" ios/App/App/Info.plist || \
                /usr/libexec/PlistBuddy -c "Set :NSHumanReadableCopyright '$COPYRIGHT_TEXT'" ios/App/App/Info.plist

                if [ -f "assets/icon-only.png" ]; then
                  npm install -D @capacitor/assets
                  npx capacitor-assets generate --ios
                fi

                npx cap sync ios

      - script@1:
          title: 3. Kompilacja czystego WizardChess3D.ipa (bez podpisu)
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -ex
                xcodebuild -project ios/App/App.xcodeproj \
                  -scheme App \
                  -configuration Release \
                  -sdk iphoneos \
                  -derivedDataPath build_data \
                  clean build \
                  CODE_SIGN_IDENTITY="" \
                  CODE_SIGN_REQUIRED=NO \
                  CODE_SIGN_ALLOWED=NO \
                  AD_HOC_CODE_SIGNING_ALLOWED=NO

                mkdir -p "$BITRISE_DEPLOY_DIR/Payload"
                cp -r build_data/Build/Products/Release-iphoneos/App.app "$BITRISE_DEPLOY_DIR/Payload/"
                cd "$BITRISE_DEPLOY_DIR"
                zip -qry "WizardChess3D.ipa" Payload
                rm -rf Payload

      - deploy-to-bitrise-io@2:
          inputs:
            - pipeline_intermediate_files: ""
    meta:
      bitrise.io:
        stack: osx-xcode-latest-stable
        machine_type_id: g2.mac.large
